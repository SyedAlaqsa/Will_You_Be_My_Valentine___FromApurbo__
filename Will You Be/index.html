<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💘</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      position: relative;
      width: 330px;
    }

    h1 {
      margin-bottom: 10px;
      color: #ff4d6d;
    }

    p {
      color: #555;
      margin-bottom: 25px;
      min-height: 20px;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      position: relative;
      height: 70px;
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: #ccc;
      color: #333;
      position: absolute;
      right: 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Will you be my Valentine? 💖</h1>
    <p id="message">Think carefully 😌</p>

    <div class="buttons">
      <button id="yes" onclick="yesClicked()">Yes 💕</button>
      <button id="no">No 🙃</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const message = document.getElementById("message");

    let yesScale = 1;
    let messageIndex = 0;

    const messages = [
      "Are you sure? 🥺",
      "That hurts a little 💔",
      "Think again 😏",
      "My heart is fragile 😭",
      "You’re playing with destiny 👀",
      "Okay now you’re just teasing 😤",
      "There’s only one correct answer 💖"
    ];

    noBtn.addEventListener("mouseover", triggerNo);
    noBtn.addEventListener("click", triggerNo);

    function triggerNo() {
      // Move NO button
      const x = Math.random() * 250;
      const y = Math.random() * 150;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;

      // Grow YES button
      yesScale += 0.1;
      yesBtn.style.transform = `scale(${yesScale})`;

      // Change message
      message.textContent = messages[messageIndex];
      messageIndex = (messageIndex + 1) % messages.length;
    }

    function yesClicked() {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
          background:linear-gradient(135deg,#ff9a9e,#fad0c4);
          font-family:Arial;
          text-align:center;
        ">
          <h1 style="color:white;font-size:42px;">
            YAY 💘💘💘<br>
            Best decision ever 😌
          </h1>
        </div>
      `;
    }
  </script>

</body>
</html>
